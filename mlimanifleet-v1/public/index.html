<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b46"><title>MlimaniFleet | Fleet Management</title><style>
:root{--navy:#102b46;--blue:#1769aa;--cyan:#e8f5fb;--ink:#1d2b3a;--muted:#708092;--line:#e4eaf0;--bg:#f5f8fb;--green:#16845b;--red:#c74747}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#102b46,#1769aa)}.auth-card{background:#fff;width:min(430px,100%);padding:32px;border-radius:18px;box-shadow:0 24px 70px #071b2e55}.brand{font-weight:800;font-size:22px;color:var(--navy);letter-spacing:-.6px}.brand span{color:#21a0c8}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#516173}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:11px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#eaf2f8;color:var(--navy)}.btn.danger{background:#fff0f0;color:var(--red)}.btn:disabled{opacity:.5}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#d7e4ee;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.sidebar .brand{color:white;padding:0 10px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#c4d4e0;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.sidefoot{margin-top:auto;font-size:12px;color:#91a8bb}.main{min-width:0}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{padding:28px 30px;max-width:1500px;margin:auto}.title{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:0}.sub{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:8px}.panel{margin:16px 0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel h3{margin:0;font-size:15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#eaf7f1;color:var(--green);font-size:11px;font-weight:700}.pill.warn{background:#fff5e7;color:#a5650a}.pill.off{background:#fff0f0;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.notice{padding:12px 14px;background:#fff7e8;border:1px solid #f4dfb8;color:#835a17;border-radius:9px;margin:14px 0}.error{color:var(--red);font-size:13px;margin-top:10px}.success{color:var(--green);font-size:13px;margin-top:10px}.mapbox{height:220px;background:linear-gradient(135deg,#e6f1f5,#dce9e7);border-radius:10px;display:grid;place-items:center;color:#58736d;text-align:center;padding:20px}.modal{position:fixed;inset:0;background:#071b2e77;display:grid;place-items:center;padding:20px}.modalbox{background:white;border-radius:15px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.sidebar .brand{padding:7px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}.top{padding:0 20px}}@media(max-width:540px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:20px}.formgrid{grid-template-columns:1fr}.top{height:60px}.content{padding:15px}.title{font-size:21px}}
</style></head><body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand">mlimani<span>fleet</span></div><p class="muted">Fleet operations and transport finance, connected.</p><div id="loginForm"><h2>Sign in</h2><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="you@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" style="width:100%" onclick="login()">Sign in securely</button><p class="muted" style="font-size:12px">New company? <a href="#" onclick="toggleRegister();return false">Start a free trial</a></p></div><div id="registerForm" class="hidden"><h2>Create company account</h2><div class="field"><label>Company name</label><input id="regCompany"></div><div class="field"><label>Your full name</label><input id="regName"></div><div class="field"><label>Work email</label><input id="regEmail" type="email"></div><div class="field"><label>Password (12+ characters)</label><input id="regPassword" type="password"></div><button class="btn" style="width:100%" onclick="registerCompany()">Create free trial</button><p class="muted"><a href="#" onclick="toggleRegister();return false">Back to sign in</a></p></div><div id="authMsg" class="error"></div></div></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">mlimani<span>fleet</span></div><div id="workspace" style="font-size:12px;padding:0 10px;color:#9fb5c7">Workspace</div><nav class="nav" id="nav"></nav><div class="sidefoot">MlimaniFleet SaaS · v1.0<br>Secure multi-company workspace</div></aside><main class="main"><header class="top"><div><b id="pageTitle">Overview</b><div class="muted" id="companyLabel" style="font-size:11px">Fleet workspace</div></div><div class="actions"><span id="userLabel" class="muted"></span><button class="btn secondary" onclick="logout()">Sign out</button></div></header><div class="content" id="view"></div></main></div>
<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox"><div class="panelhead"><h3 id="modalTitle">Add record</h3><button class="btn secondary" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<script>
const API='/api';let token=localStorage.getItem('mf_token')||'';let me=null;let current='Overview';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-TZ',{style:'currency',currency:me?.company?.currency||'TZS',maximumFractionDigits:0}).format(Number(n||0));
async function request(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(d.error||'Please sign in again')}if(!r.ok)throw Error(d.message||d.error||'Request failed');return d}
function toggleRegister(){ $('loginForm').classList.toggle('hidden');$('registerForm').classList.toggle('hidden');$('authMsg').textContent='';}
async function login(){try{$('authMsg').textContent='';const d=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('mf_token',token);await boot(d.user)}catch(e){$('authMsg').textContent=e.message}}
async function registerCompany(){try{$('authMsg').textContent='';const d=await request('/auth/register',{method:'POST',body:JSON.stringify({companyName:$('regCompany').value,name:$('regName').value,email:$('regEmail').value,password:$('regPassword').value})});token=d.token;localStorage.setItem('mf_token',token);await boot(d.user)}catch(e){$('authMsg').textContent=e.message}}
function logout(){token='';me=null;localStorage.removeItem('mf_token');$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
async function boot(user){me={...user};try{const d=await request('/me');me={...d.user,permissions:d.permissions};}catch(e){$('authMsg').textContent=e.message;return} $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=me.name+' · '+(me.role||me.platformRole);$('companyLabel').textContent=me.company?.name||'Mlimani Platform';$('workspace').textContent=me.company?.name||'PLATFORM CONTROL';buildNav();render('Overview')}
const companyMenus=[['Overview','layout-dashboard','reports:fleet'],['Vehicles','truck','vehicles:read'],['Drivers','users','drivers:read'],['Trips & Dispatch','route','trips:read'],['Fuel','fuel','fuel:read'],['Maintenance','wrench','maintenance:read'],['Tyres','circle-dot','tyres:read'],['GPS Tracking','map-pin','gps:read'],['Expenses','wallet','expenses:read'],['Accounting','calculator','accounting:read'],['Documents','file-check','documents:read'],['Reports','chart','reports:fleet'],['Users & Roles','shield','users:read']];
function can(p){const a=me?.permissions||[];return a.includes('*')||a.includes(p)||a.some(x=>x.endsWith(':*')&&p.startsWith(x.slice(0,-1)))||(a.includes('*read')&&p.endsWith(':read'))}
function buildNav(){const menus=me.platformRole?[['Platform Overview','layout-dashboard'],['Companies & Billing','building']]:companyMenus;$('nav').innerHTML=menus.filter(x=>me.platformRole||can(x[2])).map(x=>`<button data-page="${x[0]}" onclick="render('${x[0]}')">${x[0]}</button>`).join('')}
async function render(page){current=page;$('pageTitle').textContent=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(me.platformRole)return platformPage(page);if(page==='Overview')return dashboard();const map={'Vehicles':['vehicles','truck'],'Drivers':['drivers','users'],'Trips & Dispatch':['trips','route'],'Fuel':['fuel','fuel'],'Maintenance':['maintenance','wrench'],'Tyres':['tyres','circle-dot'],'Expenses':['expenses','wallet'],'Documents':['documents','file-check']};if(map[page])return tablePage(page,map[page][0]);if(page==='GPS Tracking')return gpsPage();if(page==='Accounting')return accountingPage();if(page==='Reports')return reportsPage();if(page==='Users & Roles')return usersPage();$('view').innerHTML='<div class="panel empty">This module is being prepared for the next implementation milestone.</div>'}
async function dashboard(){try{const s=await request('/company/summary');$('view').innerHTML=`<h1 class="title">Fleet overview</h1><p class="sub">A live view of your transport operation.</p><div class="grid"><div class="stat"><small>Active vehicles</small><strong>${s.vehicles}</strong></div><div class="stat"><small>Active drivers</small><strong>${s.drivers}</strong></div><div class="stat"><small>Active trips</small><strong>${s.activeTrips}</strong></div><div class="stat"><small>Open maintenance</small><strong>${s.openMaintenance}</strong></div><div class="stat"><small>Fuel spend</small><strong>${money(s.fuelSpend)}</strong></div><div class="stat"><small>Fuel volume</small><strong>${Number(s.fuelLitres).toLocaleString()} L</strong></div><div class="stat"><small>Recorded expenses</small><strong>${money(s.expenses)}</strong></div><div class="stat"><small>Subscription</small><strong style="font-size:16px">${me.company.status}</strong></div></div><div class="panel"><div class="panelhead"><h3>Quick actions</h3></div><div class="actions"><button class="btn" onclick="openForm('vehicle')">Add vehicle</button><button class="btn secondary" onclick="openForm('driver')">Add driver</button><button class="btn secondary" onclick="openForm('trip')">Plan trip</button><button class="btn secondary" onclick="openForm('fuel')">Record fuel</button></div></div><div class="notice">Trial ends ${me.company.trialEndsAt?new Date(me.company.trialEndsAt).toLocaleDateString():'according to your plan'}. Your company owner can manage users and subscription details.</div>`}catch(e){$('view').innerHTML=`<div class="error">${e.message}</div>`}}
const configs={vehicles:{title:'Vehicles',cols:['registrationNo','make','model','fuelType','odometerKm','status'],add:'vehicle'},drivers:{title:'Drivers',cols:['fullName','phone','licenceNo','licenceClass','employmentStatus'],add:'driver'},trips:{title:'Trips & Dispatch',cols:['tripNo','origin','destination','status','plannedDeparture','revenue'],add:'trip'},fuel:{title:'Fuel entries',cols:['date','vehicleId','litres','pricePerLitre','total','station'],add:'fuel'},maintenance:{title:'Maintenance jobs',cols:['jobNo','vehicleId','category','description','status','labourCost','partsCost']},tyres:{title:'Tyre register',cols:['serialNo','brand','size','position','status','purchaseCost']},expenses:{title:'Expenses',cols:['date','category','description','amount','referenceNo','approvalStatus'],add:'expense'},documents:{title:'Documents & compliance',cols:['entityType','documentType','fileName','expiryDate']}};
async function tablePage(page,resource){const c=configs[resource];try{const rows=await request('/company/'+resource);$('view').innerHTML=`<div class="panelhead"><div><h1 class="title">${c.title}</h1><p class="sub">Company records and operational history.</p></div>${c.add?`<button class="btn" onclick="openForm('${c.add}')">+ Add ${c.add}</button>`:''}</div><div class="panel"><div class="tablewrap"><table><thead><tr>${c.cols.map(x=>`<th>${x.replace(/[A-Z]/g,m=>' '+m).toUpperCase()}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${c.cols.map(k=>`<td>${formatCell(k,r[k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${c.cols.length}" class="empty">No records yet. Add your first record to get started.</td></tr>`}</tbody></table></div></div>`}catch(e){$('view').innerHTML=`<div class="panel error">${e.message}</div>`}}
function formatCell(k,v){if(v===null||v===undefined)return'—';if(k.toLowerCase().includes('date'))return new Date(v).toLocaleDateString();if(k==='total'||k==='amount'||k==='revenue'||k.includes('Cost')||k==='pricePerLitre')return money(v);if(k==='status'||k==='approvalStatus')return `<span class="pill ${String(v).includes('SUSP')?'off':''}">${v}</span>`;return String(v)}
function field(label,id,type='text',required=true,opts=null){return `<div class="field"><label>${label}</label>${opts?`<select id="f_${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input id="f_${id}" type="${type}" ${required?'required':''}>`}</div>`}
function openForm(type){let title='',fields='',endpoint='',payload=()=>({});if(type==='vehicle'){title='Add vehicle';endpoint='/company/vehicles';fields=field('Registration number','registrationNo')+field('Make','make', 'text',false)+field('Model','model','text',false)+field('Year','year','number',false)+field('Fuel type','fuelType','text',true,[['DIESEL','Diesel'],['PETROL','Petrol'],['CNG','CNG'],['ELECTRIC','Electric'],['OTHER','Other']]);payload=()=>({registrationNo:val('registrationNo'),make:val('make'),model:val('model'),year:val('year')||undefined,fuelType:val('fuelType')})}
if(type==='driver'){title='Add driver';endpoint='/company/drivers';fields=field('Full name','fullName')+field('Phone','phone','tel',false)+field('Licence number','licenceNo','text',false)+field('Licence class','licenceClass','text',false);payload=()=>({fullName:val('fullName'),phone:val('phone'),licenceNo:val('licenceNo'),licenceClass:val('licenceClass')})}
if(type==='trip'){title='Plan a trip';endpoint='/company/trips';fields=field('Trip reference','tripNo')+field('Vehicle ID','vehicleId')+field('Driver ID (optional)','driverId','text',false)+field('Origin','origin')+field('Destination','destination')+field('Planned departure','plannedDeparture','datetime-local',false)+field('Expected revenue','revenue','number',false);payload=()=>({tripNo:val('tripNo'),vehicleId:val('vehicleId'),driverId:val('driverId')||undefined,origin:val('origin'),destination:val('destination'),plannedDeparture:val('plannedDeparture')||undefined,revenue:Number(val('revenue')||0)})}
if(type==='fuel'){title='Record fuel';endpoint='/company/fuel';fields=field('Vehicle ID','vehicleId')+field('Litres','litres','number')+field('Price per litre','pricePerLitre','number')+field('Odometer km','odometerKm','number',false)+field('Station','station','text',false)+field('Receipt number','receiptNo','text',false);payload=()=>({vehicleId:val('vehicleId'),litres:Number(val('litres')),pricePerLitre:Number(val('pricePerLitre')),odometerKm:val('odometerKm')||undefined,station:val('station'),receiptNo:val('receiptNo')})}
if(type==='expense'){title='Record expense';endpoint='/company/expenses';fields=field('Category','category')+field('Description','description')+field('Amount','amount','number')+field('Vehicle ID (optional)','vehicleId','text',false)+field('Trip ID (optional)','tripId','text',false)+field('Reference number','referenceNo','text',false);payload=()=>({category:val('category'),description:val('description'),amount:Number(val('amount')),vehicleId:val('vehicleId')||undefined,tripId:val('tripId')||undefined,referenceNo:val('referenceNo')})}
$('modalTitle').textContent=title;$('modalBody').innerHTML=`<form id="recordForm" onsubmit="submitRecord(event,'${endpoint}',${payload.toString()})"><div class="formgrid">${fields}</div><div class="actions"><button class="btn" type="submit">Save record</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div><div id="formMsg"></div></form>`;$('modal').classList.remove('hidden')}
function val(id){return $('f_'+id)?.value||''}function closeModal(){$('modal').classList.add('hidden')}
async function submitRecord(e,url,make){e.preventDefault();try{await request(url,{method:'POST',body:JSON.stringify(make())});closeModal();render(current)}catch(err){$('formMsg').className='error';$('formMsg').textContent=err.message}}
function gpsPage(){$('view').innerHTML=`<h1 class="title">GPS Tracking & Route Monitoring</h1><p class="sub">Connect dedicated GPS hardware through Traccar or report phone GPS from a driver device.</p><div class="panel"><div class="mapbox"><div><b>Live map integration</b><br><small>Map tiles and live location provider are not configured yet.</small><br><small>GPS device records and position history are supported in the database foundation.</small></div></div><div class="notice">Phone GPS requires HTTPS and location permission. For continuous vehicle tracking, configure a compatible hardware tracker and Traccar server; credentials must remain server-side.</div></div>`}
function accountingPage(){$('view').innerHTML=`<h1 class="title">Accounting & Financial Management</h1><p class="sub">Finance workspace foundation — extend with full ledger posting and statements before live accounting use.</p><div class="grid"><div class="stat"><small>Accounts receivable</small><strong>—</strong></div><div class="stat"><small>Accounts payable</small><strong>—</strong></div><div class="stat"><small>Cash & bank</small><strong>—</strong></div><div class="stat"><small>Net profit</small><strong>—</strong></div></div><div class="panel"><h3>Financial modules</h3><p class="muted">General ledger · Chart of accounts · Customer invoices · Supplier bills · Receipts · Supplier payments · Bank reconciliation · Payroll · Assets & depreciation · Budgets · VAT configuration · Trial balance · Profit & loss · Balance sheet · Cash flow · Tax exports · Trip profitability.</p><div class="notice">The initial database includes core company, vehicle, trip, fuel, maintenance, tyre, expense, customer, invoice, payment and GPS entities. Double-entry journal posting, approval workflows, full statements, tax validation and TRA/EFD integration are not yet enabled.</div></div>`}
function reportsPage(){$('view').innerHTML=`<h1 class="title">Reports & Analytics</h1><p class="sub">Fleet, cost and performance reporting.</p><div class="grid"><div class="stat"><small>Revenue by truck</small><strong>—</strong></div><div class="stat"><small>Cost per km</small><strong>—</strong></div><div class="stat"><small>Fuel efficiency</small><strong>—</strong></div><div class="stat"><small>Fleet utilisation</small><strong>—</strong></div></div><div class="panel"><h3>Planned report library</h3><p class="muted">Trip profitability · Vehicle P&L · Customer profitability · Fuel consumption variance · Maintenance cost trends · Tyre cost per kilometre · Driver performance · Ageing · Budget vs actual · Cash flow · P&L · Balance sheet · Trial balance.</p></div>`}
function usersPage(){$('view').innerHTML=`<h1 class="title">Users & Role Permissions</h1><p class="sub">Assign users to least-privilege roles. Only the company owner or authorized company administrator should manage access.</p><div class="panel"><h3>Available company roles</h3><p class="muted">Company Owner · Company Admin · Fleet Manager · Dispatcher · Accountant · Finance Manager · Procurement · Maintenance Manager · Tyre Officer · GPS Controller · HR Officer · Driver · Auditor · Customer.</p><div class="notice">User creation and detailed per-action permission editor are part of the next security milestone. Do not share administrator credentials with operational staff.</div></div>`}
async function platformPage(page){if(page==='Platform Overview'){const s=await request('/platform/overview');$('view').innerHTML=`<h1 class="title">Platform Owner Dashboard</h1><p class="sub">MlimaniFleet subscription and tenant administration.</p><div class="grid"><div class="stat"><small>Total companies</small><strong>${s.companies}</strong></div><div class="stat"><small>Active subscriptions</small><strong>${s.active}</strong></div><div class="stat"><small>Suspended companies</small><strong>${s.suspended}</strong></div><div class="stat"><small>Platform users</small><strong>${s.users}</strong></div></div><div class="panel"><h3>Platform controls</h3><p class="muted">Company onboarding · Subscription status · Trial expiry · Payment extension · Suspension and reactivation · Platform support accounts.</p></div>`}else{const rows=await request('/platform/companies');$('view').innerHTML=`<h1 class="title">Companies & Billing</h1><p class="sub">Manage company access and subscription lifecycle.</p><div class="panel"><div class="tablewrap"><table><thead><tr><th>Company</th><th>Status</th><th>Users</th><th>Vehicles</th><th>Trial ends</th><th>Paid through</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${c.name}</td><td><span class="pill ${c.status==='SUSPENDED'?'off':c.status==='TRIAL'?'warn':''}">${c.status}</span></td><td>${c._count.users}</td><td>${c._count.vehicles}</td><td>${c.trialEndsAt?new Date(c.trialEndsAt).toLocaleDateString():'—'}</td><td>${c.paidThrough?new Date(c.paidThrough).toLocaleDateString():'—'}</td><td><div class="actions"><button class="btn secondary" onclick="companyStatus('${c.id}','ACTIVE')">Activate</button><button class="btn danger" onclick="companyStatus('${c.id}','SUSPENDED')">Suspend</button><button class="btn secondary" onclick="extendCompany('${c.id}')">Extend</button></div></td></tr>`).join('')}</tbody></table></div></div>`}}
async function companyStatus(id,status){const reason=status==='SUSPENDED'?'Suspended by platform owner':'';await request('/platform/companies/'+id+'/status',{method:'PATCH',body:JSON.stringify({status,reason})});render(current)}async function extendCompany(id){const date=prompt('Enter new paid-through date (YYYY-MM-DD)');if(!date)return;await request('/platform/companies/'+id+'/extend',{method:'POST',body:JSON.stringify({paidThrough:date})});render(current)}
(async()=>{if(token){try{const d=await request('/me');await boot(d.user)}catch(e){logout()}}})();
</script></body></html>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlimani
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: mlimanifleet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlimani -d mlimanifleet"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mlimani:change_me@db:5432/mlimanifleet?schema=public
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
